version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: loan_mgmt_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loan_management_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/psi-migrations:ro
      - ./database/seed.sql:/psi-seed.sql:ro
      - ./database/bootstrap.sh:/docker-entrypoint-initdb.d/001_bootstrap.sh:ro

volumes:
  postgres_data:

