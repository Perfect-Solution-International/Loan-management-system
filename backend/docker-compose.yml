version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: loan_mgmt_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loan_management_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/migrations/002_frontend_integration.sql:/docker-entrypoint-initdb.d/02_integration.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql

volumes:
  postgres_data:

