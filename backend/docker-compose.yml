version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: loan_mgmt_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loan_management_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_create_users.sql:/docker-entrypoint-initdb.d/001_create_users.sql:ro
      - ./database/migrations/002_create_customers.sql:/docker-entrypoint-initdb.d/002_create_customers.sql:ro
      - ./database/migrations/003_create_loans.sql:/docker-entrypoint-initdb.d/003_create_loans.sql:ro
      - ./database/migrations/004_create_payments.sql:/docker-entrypoint-initdb.d/004_create_payments.sql:ro
      - ./database/migrations/005_create_audit_logs.sql:/docker-entrypoint-initdb.d/005_create_audit_logs.sql:ro
      - ./database/migrations/006_create_system_settings.sql:/docker-entrypoint-initdb.d/006_create_system_settings.sql:ro
      - ./database/migrations/007_create_online_payments.sql:/docker-entrypoint-initdb.d/007_create_online_payments.sql:ro
      - ./database/migrations/008_create_loan_notes.sql:/docker-entrypoint-initdb.d/008_create_loan_notes.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/999_seed.sql:ro

volumes:
  postgres_data:

